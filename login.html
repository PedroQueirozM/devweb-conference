<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>DevWeb Conference 2026</title>
</head>

<body>
<nav>
    <a href="index.html">Voltar para o evento</a>
</nav>
<header id="topo">
    <h1>Página de Login</h1>

    <p>
        Preencha os dados abaixo para
        acessar a sua conta.
    </p>
</header>
<main>
<section id="inscricao">
    <form>
        <fieldset>
        <p>
            <label for="email">E-mail:</label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </p>

        <p>
            <label for="senha">Senha:</label>

            <input
                type="password"
                id="senha"
                name="senha"
                required
            >
        </p>
    </fieldset>

        <button type="submit">
            Realizar inscrição
        </button>

    </form>
</section>
</main>
</body>
